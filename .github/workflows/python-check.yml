name: Python syntax check

on:
  push:
    paths:
      - 'app.py'
      - '.github/workflows/python-check.yml'
  pull_request:
    paths:
      - 'app.py'
      - '.github/workflows/python-check.yml'

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile application
        run: python -m py_compile app.py
